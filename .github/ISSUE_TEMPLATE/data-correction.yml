name: Data correction
description: A wrong title, date, duplicate, irrelevant story or missing source post.
labels: [data]
body:
  - type: textarea
    id: records
    attributes:
      label: Affected records
      description: Record ids, data/news paths or source URLs.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, and what should it be?
      description: Link to evidence, such as the publisher's page.
    validations:
      required: true
