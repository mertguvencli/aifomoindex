name: Bug report
description: Something on the site, in the pipeline or in a script does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Page URL or command, repository commit, Node.js version.
